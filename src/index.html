<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' file: data:">
  <title>VigilAI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app-body">
  <div class="app-content">

    <div id="title-bar" class="title-bar drag-region">
      <span class="title-text" data-i18n="app.title">VigilAI</span>
      <div class="title-controls title-controls-main no-drag">
        <button id="btn-settings" class="title-btn" data-i18n-title="title.settings" title="设置">⚙</button>
        <button id="btn-layout" class="title-btn" data-i18n-title="title.layoutHorizontal" title="横向排列">▼</button>
        <button id="btn-pin" class="title-btn" data-i18n-title="title.pin" title="窗口置顶">▲</button>
      </div>
      <div class="title-controls title-controls-aux no-drag">
        <button id="btn-minimize" class="title-btn" data-i18n-title="title.minimize" title="最小化">─</button>
        <button id="btn-close" class="title-btn title-btn-close" data-i18n-title="title.close" title="隐藏">✕</button>
      </div>
    </div>

    <div id="cards" class="cards no-drag"></div>

  </div>
</div>

<script type="module" src="renderer/app.js"></script>
</body>
</html>
